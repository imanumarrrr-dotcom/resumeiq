<div id="cw" data-url="{{ url_for('api_chat') }}">
  <button class="cw-launch" type="button" aria-expanded="false" aria-controls="cw-panel">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>Ask ResumeIQ</button>
  <section class="cw-panel" id="cw-panel" role="dialog" aria-label="ResumeIQ assistant" hidden>
    <div class="cw-head"><div class="cw-av">✦</div><div><b>ResumeIQ assistant</b><small>Searches live jobs from our database</small></div>
      <button class="cw-x" type="button" aria-label="Close chat">×</button></div>
    <div class="cw-log" aria-live="polite"></div>
    <div class="cw-chips"></div>
    <form class="cw-form"><input name="m" maxlength="300" placeholder="Ask about jobs, scores, resumes…" autocomplete="off" aria-label="Message"><button>Send</button></form>
  </section>
</div>
